    // ==========================================
    // 手机端虚拟手柄核心事件驱动系统
    // ==========================================
    (function initVirtualGamepad() {
        const activeKeys = new Set();
        const canvas = document.getElementById('canvas');

        function sendKey(code, key, keyCode, isDown) {
            if (isDown) {
                if (activeKeys.has(code)) return;
                activeKeys.add(code);
                if (navigator.vibrate) {
                    try { navigator.vibrate(12); } catch(e){}
                }
            } else {
                if (!activeKeys.has(code)) return;
                activeKeys.delete(code);
            }

            const type = isDown ? 'keydown' : 'keyup';
            const event = new KeyboardEvent(type, {
                code: code,
                key: key,
                keyCode: keyCode,
                which: keyCode,
                bubbles: true,
                cancelable: true,
                view: window
            });

            window.dispatchEvent(event);
            document.dispatchEvent(event);
            if (canvas) canvas.dispatchEvent(event);
        }

        // 绑定所有带 [data-code] 的虚拟按键
        document.querySelectorAll('[data-code]').forEach(btn => {
            const code = btn.getAttribute('data-code');
            const key = btn.getAttribute('data-key');
            const keyCode = parseInt(btn.getAttribute('data-keycode'), 10);

            const onStart = (e) => {
                e.preventDefault();
                e.stopPropagation();
                btn.classList.add('pressed');
                sendKey(code, key, keyCode, true);
            };

            const onEnd = (e) => {
                e.preventDefault();
                e.stopPropagation();
                btn.classList.remove('pressed');
                sendKey(code, key, keyCode, false);
            };

            // Touch events
            btn.addEventListener('touchstart', onStart, { passive: false });
            btn.addEventListener('touchend', onEnd, { passive: false });
            btn.addEventListener('touchcancel', onEnd, { passive: false });

            // Mouse events for desktop test
            btn.addEventListener('mousedown', onStart);
            btn.addEventListener('mouseup', onEnd);
            btn.addEventListener('mouseleave', onEnd);
        });

        // 全屏切换按钮
        const btnFs = document.getElementById('btn-fullscreen');
        if (btnFs) {
            btnFs.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            });
        }

        // 手柄显隐切换
        const btnTogglePad = document.getElementById('btn-toggle-pad');
        const gamepadLayer = document.querySelector('.bottom-gamepad');
        if (btnTogglePad && gamepadLayer) {
            btnTogglePad.addEventListener('click', () => {
                const isHidden = gamepadLayer.style.display === 'none';
                gamepadLayer.style.display = isHidden ? 'flex' : 'none';
                btnTogglePad.innerText = isHidden ? '🎮 隐藏手柄' : '🎮 显示手柄';
            });
        }

        // 点击开始卡片启动游戏
        const infobox = document.getElementById('infobox');
        if (infobox) {
            const startHandler = () => {
                if (window.MM) {
                    window.MM.UME = true;
                }
                infobox.style.display = 'none';
            };
            infobox.addEventListener('click', startHandler);
            infobox.addEventListener('touchstart', startHandler, { passive: true });
        }

        // 监听屏幕旋转提示
        function checkOrientation() {
            const hint = document.getElementById('orientation-hint');
            if (!hint) return;
            const isPortrait = window.innerHeight > window.innerWidth;
            const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
            if (isMobile && isPortrait) {
                hint.style.display = 'block';
            } else {
                hint.style.display = 'none';
            }
        }
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        checkOrientation();
    })();
    </script>
</body>
</html>
